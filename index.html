<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Class Materials — Hub</title>
<style>
  :root{
    --bg0:#070b16; --bg1:#0c1322; --ink:#eef2fb; --muted:#9aa6c0; --faint:#6b7696;
    --card:rgba(255,255,255,.035); --cardbd:rgba(255,255,255,.09); --chip:rgba(255,255,255,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);line-height:1.5;min-height:100vh;
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(99,102,241,.22), transparent 60%),
      radial-gradient(800px 480px at 92% 2%, rgba(236,72,153,.18), transparent 55%),
      radial-gradient(700px 500px at 60% 120%, rgba(6,182,212,.14), transparent 55%),
      linear-gradient(180deg,var(--bg0),var(--bg1));
    background-attachment:fixed;}

  header{padding:46px 20px 22px;text-align:center;max-width:1180px;margin:0 auto}
  header h1{font-size:clamp(1.8rem,4.5vw,2.7rem);letter-spacing:-.6px;font-weight:800;
    background:linear-gradient(92deg,#a5b4fc,#f0abfc 42%,#67e8f9 85%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  header p{margin:10px auto 0;max-width:580px;color:var(--muted);font-size:.96rem}
  .stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .stat{background:var(--chip);border:1px solid var(--cardbd);border-radius:999px;
    padding:6px 14px;font-size:.8rem;color:var(--muted)}
  .stat b{color:var(--ink)}

  /* two-column layout: left sidebar nav + content */
  .layout{max-width:1240px;margin:16px auto 0;padding:0 16px 70px;
    display:grid;grid-template-columns:258px 1fr;gap:26px;align-items:start}
  .side{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px)}
  .search{position:relative;flex:0 0 auto}
  .search input{width:100%;background:var(--chip);border:1px solid var(--cardbd);border-radius:11px;
    color:var(--ink);font-size:.9rem;padding:10px 14px 10px 38px;outline:none;transition:.15s}
  .search input:focus{border-color:#818cf8;background:rgba(129,140,248,.08)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  .nav{background:var(--card);border:1px solid var(--cardbd);border-radius:14px;padding:8px;overflow-y:auto}
  #chips{display:flex;flex-direction:column;gap:3px}
  .chip{cursor:pointer;border:1px solid transparent;background:transparent;text-align:left;
    color:var(--muted);font-size:.86rem;font-weight:600;padding:9px 12px;border-radius:10px;
    transition:.14s;display:flex;align-items:center;gap:9px;font-family:inherit;width:100%}
  .chip .ct{margin-left:auto;font-size:.72rem;opacity:.8;background:rgba(255,255,255,.08);
    border-radius:999px;padding:1px 8px}
  .chip:hover{color:var(--ink);background:var(--chip)}
  .chip.active{color:#07101f;background:var(--cc,#818cf8);border-color:var(--cc,#818cf8)}
  .chip.active .ct{background:rgba(0,0,0,.18);color:#07101f}
  .chip.prog{font-weight:800;font-size:.9rem;color:var(--ink);margin-top:6px;
    border-left:3px solid var(--cc,#818cf8);border-radius:6px 10px 10px 6px}
  .chip.sub{padding-left:26px;font-size:.83rem}
  .chip.sub::before{content:"";position:absolute;margin-left:-14px;width:5px;height:5px;border-radius:50%;
    background:var(--cc,#818cf8);opacity:.7}
  .chip.sub{position:relative}

  .content{min-width:0}
  .prog-band{margin:6px 0 20px;padding-bottom:10px;border-bottom:1px solid var(--cardbd)}
  .prog-band:not(:first-child){margin-top:26px}
  .prog-band h2{font-size:1.5rem;font-weight:800;letter-spacing:-.4px;
    background:linear-gradient(92deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .prog-band p{color:var(--muted);font-size:.9rem;margin-top:4px}
  section{margin:0 0 30px;scroll-margin-top:16px}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;
    padding-left:13px;border-left:4px solid var(--cc,#818cf8)}
  .sec-head .emoji{font-size:1.35rem}
  .sec-head h3{font-size:1.1rem;font-weight:800}
  .sec-head .sc{margin-left:auto;font-size:.74rem;color:var(--faint);
    border:1px solid var(--cardbd);border-radius:999px;padding:3px 10px}
  .sec-sub{color:var(--muted);margin:-6px 0 14px 17px;font-size:.86rem;max-width:760px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:13px}
  .card{background:var(--card);border:1px solid var(--cardbd);border-radius:15px;
    padding:15px 15px 13px;position:relative;overflow:hidden;transition:.16s}
  .card::before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:var(--cc,#818cf8);opacity:.85}
  .card:hover{transform:translateY(-3px);border-color:var(--cc,#818cf8);box-shadow:0 12px 30px rgba(0,0,0,.35)}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:800;
    letter-spacing:.06em;text-transform:uppercase;color:var(--cc,#818cf8);
    background:color-mix(in srgb, var(--cc,#818cf8) 16%, transparent);
    border:1px solid color-mix(in srgb, var(--cc,#818cf8) 32%, transparent);
    border-radius:7px;padding:3px 9px;margin-bottom:9px}
  .card h4{font-size:.96rem;font-weight:700;line-height:1.35;margin-bottom:11px;color:#f4f7ff}
  .links{display:flex;flex-wrap:wrap;gap:7px}
  .links a{font-size:.78rem;text-decoration:none;padding:6px 11px;border-radius:8px;
    border:1px solid transparent;font-weight:600;transition:.13s}
  .l-s{color:#bfdbfe;background:rgba(96,165,250,.14);border-color:rgba(96,165,250,.32)}
  .l-a{color:#bbf7d0;background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.32)}
  .l-e{color:#fde68a;background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.32)}
  .l-s:hover{background:rgba(96,165,250,.28)} .l-a:hover{background:rgba(52,211,153,.28)} .l-e:hover{background:rgba(251,191,36,.28)}

  .empty{display:none;text-align:center;color:var(--faint);padding:60px 20px;font-size:.95rem}
  footer{border-top:1px solid var(--cardbd);padding:24px 20px;text-align:center;color:var(--faint);font-size:.8rem}
  footer code{background:var(--chip);padding:2px 7px;border-radius:5px}
  @media(max-width:820px){
    .layout{grid-template-columns:1fr;gap:16px}
    .side{position:static;max-height:none}
    .nav{background:transparent;border:none;padding:0}
    #chips{flex-direction:row;flex-wrap:wrap;gap:8px}
    .chip{width:auto;border:1px solid var(--cardbd);background:var(--chip);border-radius:999px;padding:8px 13px}
    .chip.sub{padding-left:13px}.chip.sub::before{display:none}
    .chip.prog{border-left:none;border-radius:999px}
    .chip .ct{margin-left:6px}
  }
  @media(max-width:520px){.sec-head .sc{display:none}}
</style>
</head>

     {b:"TP8",t:"Writing — Travel Brochure",l:[L("Slides","class_slides_TP8_6.html"),L("Activity","student_activity_TP8_16.html",A),L("Teacher Script","Teacher_Script_TP8_4.html",E)]}
    ]}
  ]}
];

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function modCount(m){return m.lessons.length;}
function progCount(p){return p.modules.reduce(function(n,m){return n+m.lessons.length;},0);}
var total=PROGRAMS.reduce(function(n,p){return n+progCount(p);},0);

/* stats */
document.getElementById('stats').innerHTML=
  '<span class="stat"><b>'+total+'</b> lessons</span>'+
  PROGRAMS.map(function(p){return '<span class="stat"><b>'+progCount(p)+'</b> '+esc(p.name.split(' —')[0])+'</span>';}).join('');

/* sidebar chips + content sections */
var chips=document.getElementById('chips');
var secWrap=document.getElementById('sections');

function chipEl(sel,label,count,cc,cls){
  var b=document.createElement('button'); b.className='chip'+(cls?' '+cls:''); b.setAttribute('data-sel',sel);
  if(cc)b.style.setProperty('--cc',cc);
  b.innerHTML=esc(label)+(count!=null?'<span class="ct">'+count+'</span>':'');
  b.onclick=function(){ state.sel=sel; apply(); window.scrollTo({top:0}); };
  chips.appendChild(b); return b;
}
chipEl('all','All',total,'#818cf8');

var n=0;
PROGRAMS.forEach(function(p){
  chipEl('prog:'+p.id, p.name, progCount(p), p.c2, 'prog');
  var showSub = p.modules.length>1;
  // program band in content
  var band=document.createElement('div'); band.className='prog-band'; band.setAttribute('data-prog',p.id);
  band.style.setProperty('--c1',p.c1); band.style.setProperty('--c2',p.c2);
  band.innerHTML='<h2>'+esc(p.name)+'</h2><p>'+esc(p.sub)+'</p>';
  secWrap.appendChild(band);
  p.modules.forEach(function(m){
    if(showSub) chipEl('mod:'+m.id, m.emoji+' '+m.name, modCount(m), m.cc, 'sub');
    var sec=document.createElement('section'); sec.setAttribute('data-prog',p.id); sec.setAttribute('data-mod',m.id);
    sec.style.setProperty('--cc',m.cc);
    var cards=m.lessons.map(function(ls){
      var badge = m.badges ? ls.b : ('Class '+String(++n).padStart(2,'0'));
      var links=ls.l.map(function(x){return '<a class="l-'+x.t+'" href="'+x.href+'">'+esc(x.label)+'</a>';}).join('');
      return '<div class="card" data-txt="'+esc((ls.t+' '+badge).toLowerCase())+'">'+
        '<span class="badge">'+esc(badge)+'</span><h4>'+esc(ls.t)+'</h4><div class="links">'+links+'</div></div>';
    }).join('');
    sec.innerHTML='<div class="sec-head"><span class="emoji">'+m.emoji+'</span><h3>'+esc(m.name)+'</h3>'+
      '<span class="sc">'+modCount(m)+' lessons</span></div>'+
      '<p class="sec-sub">'+esc(m.sub)+'</p><div class="grid">'+cards+'</div>';
    secWrap.appendChild(sec);
  });
});

/* filtering */
var state={sel:'all',q:''};
function apply(){
  var q=state.q.trim().toLowerCase();
  var sel=q?'all':state.sel;
  document.querySelectorAll('.chip').forEach(function(ch){ ch.classList.toggle('active', ch.getAttribute('data-sel')===sel); });
  var progVisible={}; var anyVisible=false;
  document.querySelectorAll('section').forEach(function(sec){
    var prog=sec.getAttribute('data-prog'), mod=sec.getAttribute('data-mod');
    var scopeOK = sel==='all' || sel==='prog:'+prog || sel==='mod:'+mod;
    var shown=0;
    sec.querySelectorAll('.card').forEach(function(card){
      var match = scopeOK && (!q || card.getAttribute('data-txt').indexOf(q)>=0);
      card.style.display=match?'':'none'; if(match)shown++;
    });
    var vis = scopeOK && shown>0;
    sec.style.display=vis?'':'none';
    if(vis){ progVisible[prog]=true; anyVisible=true; }
  });
  document.querySelectorAll('.prog-band').forEach(function(band){
    band.style.display=progVisible[band.getAttribute('data-prog')]?'':'none';
  });
  document.getElementById('empty').style.display=anyVisible?'none':'block';
}
document.getElementById('q').addEventListener('input',function(e){ state.q=e.target.value; apply(); });
apply();
</script>
</body>
